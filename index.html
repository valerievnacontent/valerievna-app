:root{
  --bg:#F6EBDD;          /* крем */
  --surface:#FFF8EF;
  --fg:#1A0C0D;
  --muted:#6E5A55;
  --line:#E2D1BF;
  --red:#A50D0D;         /* глубокий красный */
  --red-deep:#7A0508;
  --ruby:#D4001A;        /* сигнальный рубин */
  --cream:#F6EBDD;
  --ink:#0E0E0F;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-heavy:"Montserrat","Arial Black",Arial,sans-serif;
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Bad Script","Segoe Script",cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto}
svg.star{display:block}

/* шапка: красный фон, портрет в круге */
.hero{background:radial-gradient(90% 55% at 15% 35%,rgba(196,22,20,.65),rgba(196,22,20,0) 70%),linear-gradient(180deg,#A50D0D 0%,#7A0508 100%);color:var(--cream);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.hero-in{max-width:560px;margin:0 auto;padding:26px 24px 52px;position:relative}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tag{display:inline-block;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(246,235,221,.55);border-radius:99px;padding:5px 12px}
.hand{font-family:var(--f-hand)}
.top .hand{font-size:19px;transform:rotate(-3deg);white-space:nowrap}
.avatar{position:relative;width:min(44%,168px);margin:20px 0 0 6px}
.avatar img{width:100%;aspect-ratio:1;display:block;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px rgba(246,235,221,.92),0 18px 36px rgba(0,0,0,.4)}
.avatar .star{position:absolute;width:38%;right:-30%;bottom:-6%;color:var(--cream);transform:rotate(8deg)}
.hero h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;line-height:1.26;font-size:clamp(30px,11.2vw,58px);white-space:nowrap;margin-top:22px;letter-spacing:.005em}
.hero h1 span{display:block}
.hero .lead{font-size:18px;line-height:1.4;max-width:30ch;margin-top:14px;opacity:.96}

/* призыв: чёрный блок, один акцент - рубиновая кнопка */
.main{padding:0 20px}
.cta{position:relative;margin-top:-30px;background:var(--ink);color:var(--cream);border-radius:8px;padding:30px 24px 26px;overflow:hidden;box-shadow:0 14px 30px rgba(14,14,15,.28)}
.cta .star{position:absolute;width:120px;right:-26px;top:-24px;color:rgba(246,235,221,.16)}
.cta h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1.1;position:relative}
.cta p{margin-top:14px;font-size:18px;line-height:1.4;color:rgba(246,235,221,.88);position:relative}
.btn{display:inline-block;margin-top:22px;background:var(--ruby);color:#fff;text-decoration:none;font-weight:600;font-size:17px;padding:15px 28px;border-radius:99px;position:relative;box-shadow:0 6px 0 #8F0014;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8F0014}

/* карточки */
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h b{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.1}
.sec-h span{font-family:var(--f-hand);font-size:20px;color:var(--red);transform:rotate(-2deg)}
.list{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;transition:transform .12s,border-color .15s,background .15s}
.card:active{transform:scale(.985);border-color:var(--red);background:#fff}
.num{flex:none;width:46px;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--red);letter-spacing:.01em}
.body{flex:1;min-width:0;border-left:3px solid var(--ruby);padding-left:14px}
.title{font-family:var(--f-heavy);font-weight:800;font-size:16px;line-height:1.25}
.sub{margin-top:5px;font-size:14px;line-height:1.35;color:var(--muted)}
.arrow{flex:none;width:24px;height:24px;color:var(--red)}

/* подвал */
footer{max-width:560px;margin:46px auto 0;padding:0 24px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:6px}
footer .star{width:44px;height:44px;color:var(--red)}
footer .sig{font-family:var(--f-hand);font-size:34px;line-height:1.05;color:var(--red)}
footer .nick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* вкладки: плавающий чёрный «док» с рубиновой плашкой */
.page[hidden]{display:none}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.dock{pointer-events:auto;position:relative;max-width:420px;margin:0 auto;display:flex;background:var(--ink);border-radius:999px;padding:6px;box-shadow:0 14px 30px rgba(14,14,15,.38),0 0 0 3px var(--bg)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:999px;background:linear-gradient(160deg,#E4001C,var(--ruby) 60%,#B80016);box-shadow:0 4px 10px rgba(212,0,26,.45);transition:transform .32s cubic-bezier(.3,1.35,.5,1)}
.tab{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px;background:none;border:0;border-radius:999px;font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:.02em;color:rgba(246,235,221,.62);cursor:pointer;transition:color .2s}
.tab svg{width:22px;height:22px;flex:none;transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] svg{transform:scale(1.12) rotate(-6deg)}
.tab:focus-visible{outline:3px solid var(--cream);outline-offset:-3px}

/* вкладка соцсетей */
.hero.compact .hero-in{padding:26px 24px 52px}
.hero.compact h1{margin-top:22px}
.plats{display:flex;flex-direction:column;gap:12px}
.plat{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;transition:transform .12s,border-color .15s,background .15s}
.plat:active{transform:scale(.985);border-color:var(--red);background:#fff}
.tile{flex:none;width:60px;height:60px;display:grid;place-items:center;border-radius:24%;background:linear-gradient(160deg,#fff 0%,#E6E6F0 100%);box-shadow:2px 4px 0 #BFBFCF,5px 10px 14px rgba(0,0,0,.25),inset 0 2px 1px #fff;transform:rotate(-5deg)}
.plat:nth-child(even) .tile{transform:rotate(4deg)}
.tile img{width:60%;height:60%;object-fit:contain;display:block}
.tile.raw{background:none;box-shadow:none;filter:drop-shadow(3px 6px 6px rgba(0,0,0,.3))}
.tile.raw img{width:100%;height:100%}
.pbody{flex:1;min-width:0}
.pname{font-family:var(--f-heavy);font-weight:800;font-size:16px;line-height:1.2}
.pat{font-family:var(--f-hand);font-size:17px;color:var(--red);margin-top:2px;overflow-wrap:anywhere}
.prole{margin-top:3px;font-size:14px;line-height:1.35;color:var(--muted)}
.start{display:block;position:relative;overflow:hidden;margin-top:28px;text-decoration:none;color:var(--cream);background:radial-gradient(90% 90% at 15% 0%,#B8110F,var(--red) 55%,var(--red-deep));border-radius:8px;padding:24px 22px 22px;box-shadow:0 12px 26px rgba(122,5,8,.28);transition:transform .12s}
.start:active{transform:scale(.985)}
.start .star{position:absolute;width:110px;right:-20px;bottom:-22px;color:rgba(246,235,221,.22)}
.start .lab{font-family:var(--f-hand);font-size:22px;transform:rotate(-2deg);display:inline-block}
.start .st{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1.1;margin-top:8px;position:relative}
.start .ss{margin-top:10px;font-size:16px;line-height:1.4;opacity:.92;max-width:34ch;position:relative}
.start .go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-weight:600;font-size:15px;background:var(--cream);color:var(--red);border-radius:99px;padding:10px 18px;position:relative}
.start .go svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:12px 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--cream)}
.chip:focus-visible{outline:3px solid var(--ruby);outline-offset:2px}
.card[hidden]{display:none}
.new{display:inline-block;vertical-align:2px;margin-left:8px;background:var(--ruby);color:#fff;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:2px 9px}
.share{margin-top:34px;text-align:center}
.share p{font-family:var(--f-hand);font-size:22px;color:var(--red);transform:rotate(-1.5deg)}
.btn.ghost{background:transparent;color:var(--red);border:2px solid var(--red);box-shadow:none;margin-top:12px;padding:12px 26px}
.btn.ghost:active{transform:scale(.97);box-shadow:none}
.cnt{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.note{margin-top:22px;font-size:12px;line-height:1.4;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn,.card,.plat,.start,.ind,.tab,.tab svg{transition:none}}
</style>

  var D = window.KK_DATA;
  var HEADER = "#A50D0D", BG = "#F6EBDD";

  // --- внутри ли Телеграма ---
  var hash = location.hash || "", search = location.search || "";
  var inTG = false;
  try {
    inTG = hash.indexOf("tgWebApp") !== -1 ||
           search.indexOf("tgWebApp") !== -1 ||
           !!window.TelegramWebviewProxy ||
           !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction);
  } catch (e) {}

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  // --- запуск ---
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor(HEADER); } catch (e) {}
    try { tg.setBackgroundColor(BG); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor(BG); } catch (e) {}
  }

  // --- разметка из данных ---
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var target = inTG ? "_self" : "_blank";
  var star = function (cls) { return '<svg class="star ' + (cls || "") + '" viewBox="0 0 100 100" aria-hidden="true"><use href="#star"/></svg>'; };
  var arrowSvg = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

  var tabIcons = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.4.1 4 1.9 4 4.3"/></svg>'
  ];
  function hero(cfg, withAvatar, compact) {
    var s = '<header class="hero' + (compact ? ' compact' : '') + '"><div class="hero-in">';
    s += '<div class="top"><span class="tag">' + esc(cfg.eyebrow) + '</span><span class="hand">' + esc(D.handNote) + '</span></div>';
    if (withAvatar && D.avatar) s += '<div class="avatar"><img src="' + esc(D.avatar) + '" alt="">' + star() + '</div>';
    s += '<h1>' + cfg.titleLines.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join("") + '</h1>';
    s += '<p class="lead">' + esc(cfg.lead) + '</p></div></header>';
    return s;
  }
  function link(url, cls, inner) {
    return '<a class="' + cls + '" href="' + esc(url) + '" data-url="' + esc(url) + '" target="' + target + '" rel="noopener">' + inner + '</a>';
  }

  // вкладка 1: основное
  var p1 = hero(D, true, false);
  p1 += '<div class="main wrap"><section class="cta">' + star() + '<h2>' + esc(D.cta.title) + '</h2><p>' + esc(D.cta.text) + '</p>' +
        link(D.cta.url, "btn", esc(D.cta.button)) + '</section>';
  var st = D.start;
  p1 += link(st.url, "start", star() + '<span class="lab">' + esc(st.label) + '</span><div class="st">' + esc(st.title) + '</div><div class="ss">' + esc(st.sub) + '</div>' +
        '<span class="go">' + esc(st.button) + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>');
  p1 += '<section class="sec"><div class="sec-h"><b>' + esc(D.listTitle) + '</b><span>' + esc(D.listNote) + '</span></div>';
  p1 += '<div class="chips" role="group" aria-label="Рубрики">' + D.filters.map(function (f, i) {
    return '<button class="chip" type="button" data-f="' + esc(f) + '" aria-pressed="' + (i === 0) + '">' + esc(f) + '</button>';
  }).join("") + '</div><div class="list">';
  D.cards.forEach(function (c, i) {
    p1 += link(c.url, "card",
      '<div class="num">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</div>' +
      '<div class="body"><div class="title">' + esc(c.title) + (c.new ? '<span class="new">' + esc(D.newLabel) + '</span>' : '') + '</div><div class="sub">' + esc(c.sub) + '</div></div>' + arrowSvg)
      .replace('class="card"', 'class="card" data-tags="' + esc((c.tags || []).join("|")) + '"');
  });
  var sh = D.share, shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(sh.url) + "&text=" + encodeURIComponent(sh.text);
  p1 += '</div><div class="share"><p>' + esc(sh.note) + '</p>' + link(shareUrl, "btn ghost", esc(sh.button)) + '</div></section></div>';

  // вкладка 2: соцсети
  var S = D.social, icons = window.KK_ICONS || {};
  var p2 = hero(S, false, true);
  p2 += '<div class="main wrap"><section class="sec" style="margin-top:28px"><div class="plats">';
  S.items.forEach(function (it) {
    var raw = (it.icon === "th" || it.icon === "vk") ? " raw" : "";
    p2 += link(it.url, "plat",
      '<span class="tile' + raw + '"><img src="' + esc(icons[it.icon] || "") + '" alt=""></span>' +
      '<span class="pbody"><div class="pname">' + esc(it.name) + '</div><div class="pat">' + esc(it.handle) + '</div>' +
      (it.count ? '<div class="cnt">' + esc(it.count) + '</div>' : '') + (it.role ? '<div class="prole">' + esc(it.role) + '</div>' : '') + '</span>' + arrowSvg);
  });
  p2 += '</div><p class="note">' + esc(S.note) + '</p></section></div>';

  var foot = '<footer>' + star() + '<div class="sig">' + esc(D.footer) + '</div><div class="nick">' + esc(D.handNote) + '</div></footer>';
  var tabsHtml = '<nav class="tabs"><div class="dock" role="tablist"><span class="ind" id="ind" style="width:calc((100% - 12px) / ' + D.tabs.length + ')"></span>' + D.tabs.map(function (n, i) {
    return '<button class="tab" type="button" role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + tabIcons[i] + '<span>' + esc(n) + '</span></button>';
  }).join("") + '</div></nav>';

  document.getElementById("app").innerHTML =
    '<div class="page" id="pg0" role="tabpanel">' + p1 + foot + '</div><div class="page" id="pg1" role="tabpanel" hidden>' + p2 + foot + '</div>' + tabsHtml;

  // --- фильтр по рубрикам ---
  var chips = document.querySelectorAll(".chip"), cardEls = document.querySelectorAll(".card");
  for (var k = 0; k < chips.length; k++) chips[k].addEventListener("click", function (ev) {
    var f = ev.currentTarget.getAttribute("data-f"), all = (f === D.filters[0]);
    for (var m = 0; m < chips.length; m++) chips[m].setAttribute("aria-pressed", String(chips[m] === ev.currentTarget));
    for (var n = 0; n < cardEls.length; n++) {
      var tags = (cardEls[n].getAttribute("data-tags") || "").split("|");
      cardEls[n].hidden = !(all || tags.indexOf(f) !== -1);
    }
    var shown = 0;
    for (var q = 0; q < cardEls.length; q++) if (!cardEls[q].hidden) { shown++; cardEls[q].querySelector(".num").textContent = (shown < 10 ? "0" : "") + shown; }
  });

  // --- переключение вкладок ---
  var tabBtns = document.querySelectorAll(".tab");
  function showTab(n) {
    for (var i = 0; i < tabBtns.length; i++) {
      tabBtns[i].setAttribute("aria-selected", String(i === n));
      document.getElementById("pg" + i).hidden = (i !== n);
    }
    var ind = document.getElementById("ind");
    if (ind) ind.style.transform = "translateX(" + (n * 100) + "%)";
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {}
    window.scrollTo(0, 0);
  }
  for (var j = 0; j < tabBtns.length; j++) (function (n) { tabBtns[n].addEventListener("click", function () { showTab(n); }); })(j);

  // --- прямая отправка событий (если нет Telegram.WebApp) ---
  function postEvent(name, data) {
    var json = JSON.stringify(data || {});
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
        window.TelegramWebviewProxy.postEvent(name, json);
        return true;
      }
    } catch (e) {}
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) {
        window.webkit.messageHandlers.performAction.postMessage({ eventType: name, eventData: data || {} });
        return true;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: name, eventData: data || {} }), "*");
        return true;
      }
    } catch (e) {}
    return false;
  }

  // --- клик по ссылке ---
  function onClick(ev) {
    var url = ev.currentTarget.getAttribute("data-url");
    if (!url || !inTG) return; // в обычном браузере ссылка открывается сама
    ev.preventDefault();
    var isTme = url.indexOf("https://t.me/") === 0;

    if (tg) {
      if (isTme) {
        try { tg.close(); } catch (e) {}          // сначала закрываем
        try { tg.openTelegramLink(url); } catch (e) {} // сразу после - открываем ссылку
      } else {
        try { tg.openLink(url); } catch (e) { location.href = url; }
      }
    } else {
      if (isTme) {
        postEvent("web_app_close", {});
        postEvent("web_app_open_tg_link", { path_full: url.replace("https://t.me/", "") });
      } else {
        postEvent("web_app_open_link", { url: url });
      }
    }
  }

  var links = document.querySelectorAll("a[data-url]");
  for (var i = 0; i < links.length; i++) links[i].addEventListener("click", onClick);
})();
</script>
</body>
</html>
